# Uptime monitor for the production site + verifier, every 10 minutes.
#
# Failure modes and what you get:
#   - any check fails -> the job fails -> GitHub EMAILS the repo owner
#   - plus ONE open "uptime" issue (deduped: subsequent failures comment on it,
#     so the issue board shows the outage history without spam)
#   - recovery does nothing automatically — close the issue when back up.
name: uptime

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check site pages and verifier health
        run: |
          set -uo pipefail
          fail=0
          check() {
            name="$1"; url="$2"; expect="$3"
            code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" --max-time 25 --retry 2 --retry-delay 5 "$url" || echo "000")
            if [ "$code" != "200" ]; then
              echo "::error::$name returned HTTP $code"
              fail=1
            elif [ -n "$expect" ] && ! grep -q "$expect" /tmp/body.txt; then
              echo "::error::$name loaded but did not contain '$expect'"
              fail=1
            else
              echo "$name OK ($code)"
            fi
          }
          check "site home"        "https://vyral.guildera.ai/"                          "VYRAL"
          check "marketplace"      "https://vyral.guildera.ai/marketplace"               ""
          check "verifier health"  "https://xverify.guildera.ai/health"                  "\"chatReader\":true"
          exit $fail

      - name: Browser-level check (catches client-side crashes HTTP probes miss)
        run: |
          npm install --no-save --no-audit --no-fund patchright
          node scripts/uptime-browser.mjs

      - name: Open or update the outage issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const now = new Date().toISOString();
            const label = "uptime";
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: "b60205" });
            }
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: label, per_page: 5,
            });
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner, repo, title: `DOWN: uptime probe failed at ${now}`,
                labels: [label],
                body: `Automated uptime monitor failed.\n\nFailing run: ${runUrl}\n\nThe monitor comments here every ~10 min while still down. Close this issue when service is restored.`,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number,
                body: `Still down at ${now} — ${runUrl}`,
              });
            }
